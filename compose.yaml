services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: timeops
      POSTGRES_DB: timeops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Preencha POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - timeops-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timeops -d timeops"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TIMEOPS_PORT:-5191}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__TimeOps: Host=db;Database=timeops;Username=timeops;Password=${POSTGRES_PASSWORD}
      Database__MigrateOnStartup: "true"
      ReverseProxy__KnownProxies__0: ${TIMEOPS_TRUSTED_PROXY_IP:-127.0.0.1}
      GitHub__Organization: ${GITHUB_ORGANIZATION:-}
      GitHub__AppId: ${GITHUB_APP_ID:-}
      GitHub__InstallationId: ${GITHUB_INSTALLATION_ID:-}
      GitHub__ClientId: ${GITHUB_CLIENT_ID:-}
      GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET:-}
      GitHub__BootstrapAdminId: ${GITHUB_BOOTSTRAP_ADMIN_ID:-}
      GitHub__WebhookSecret: ${GITHUB_WEBHOOK_SECRET:-}
      GitHub__PrivateKeyPath: /run/secrets/github-private-key
    secrets:
      - github-private-key
    volumes:
      - timeops-keys:/data/keys
    restart: unless-stopped
secrets:
  github-private-key:
    file: ${GITHUB_PRIVATE_KEY_FILE:-.secrets/github.pem}
volumes:
  timeops-db:
  timeops-keys:
