name: Validate TimeOps
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: timeops
          POSTGRES_PASSWORD: timeops_ci_only
          POSTGRES_DB: timeops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U timeops -d timeops"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore TimeOps.slnx --disable-parallel
      - name: Domain, application and regression tests
        run: dotnet test tests/TimeOps.Tests -c Release --no-restore
      - name: Browser script regression tests
        run: node --test tests/interaction/*.test.mjs
      - name: Build server and browser tests
        run: dotnet build tests/TimeOps.E2E -c Release --no-restore
      - name: Install Chromium
        run: node tests/TimeOps.E2E/bin/Release/net10.0/.playwright/package/cli.js install --with-deps chromium
      - name: HTTP, database and browser tests
        run: dotnet test tests/TimeOps.E2E -c Release --no-build --no-restore
      - name: Repeat integration flows with PostgreSQL
        env:
          TIMEOPS_TEST_POSTGRES: Host=localhost;Database=timeops;Username=timeops;Password=timeops_ci_only
        run: dotnet test tests/TimeOps.E2E -c Release --no-build --no-restore
      - name: Apply initial PostgreSQL migration
        env:
          ConnectionStrings__TimeOps: Host=localhost;Database=timeops;Username=timeops;Password=timeops_ci_only
        run: dotnet run --project src/TimeOps.Web -c Release --no-build -- --migrate
      - name: Verify server image
        run: docker build -t timeops-ci .
      - name: Verify container migration
        run: docker run --rm --network host -e "ConnectionStrings__TimeOps=Host=localhost;Database=timeops;Username=timeops;Password=timeops_ci_only" timeops-ci --migrate
      - name: Publish server
        run: dotnet publish src/TimeOps.Web -c Release --no-restore -o artifacts/server
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: timeops-verification
          path: |
            artifacts/server
            .impeccable/review
          retention-days: 7
