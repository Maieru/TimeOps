name: Deploy TimeOps to Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TimeOps.slnx

      - name: Test
        run: dotnet test tests/TimeOps.Tests/TimeOps.Tests.csproj -c Release --no-restore

      - name: Test browser scripts
        run: node --test tests/interaction/*.test.mjs

      - name: Publish WebAssembly
        run: dotnet publish src/TimeOps.Web/TimeOps.Web.csproj -c Release --no-restore -o publish

      - name: Build Playwright tests
        run: dotnet build tests/TimeOps.E2E/TimeOps.E2E.csproj -c Release --no-restore

      - name: Install Chromium for Playwright
        run: pwsh tests/TimeOps.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test end-to-end with mocked Azure DevOps
        env:
          E2E_WEB_ROOT: ${{ github.workspace }}/publish/wwwroot
          E2E_HEADLESS: '1'
          E2E_SLOWMO: '0'
        run: dotnet test tests/TimeOps.E2E/TimeOps.E2E.csproj -c Release --no-build --no-restore --logger "trx;LogFileName=e2e.trx" --results-directory artifacts/e2e-results

      - name: Upload Playwright screenshots, traces and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-e2e
          path: |
            artifacts/e2e/
            artifacts/e2e-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Test Pages preparation
        run: python3 -m unittest discover -s tests/publishing -v

      - name: Setup Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Prepare and validate static site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 scripts/prepare_pages.py publish/wwwroot --base-path "$BASE_PATH"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: publish/wwwroot

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
